name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Requires maven.neoforged.net to be reachable from GitHub runners.
      # If the upstream repository is down, this job fails while resolving
      # net.neoforged:neoform-runtime; that is an infrastructure issue, not a code issue.
      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lolipickaxe-jar
          path: build/libs/*.jar
