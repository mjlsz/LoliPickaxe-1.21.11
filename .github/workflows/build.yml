name: checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  resources:
    name: resource checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resources
        run: python ci_check.py

  build:
    name: gradle build (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The full build needs maven.neoforged.net (NeoForm runtime). While that
      # repository is unreachable this job is expected to fail; the resource
      # checks above are the authoritative CI signal.
      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lolipickaxe-jar
          path: build/libs/*.jar
